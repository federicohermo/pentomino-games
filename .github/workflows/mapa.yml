# El registro se deriva, no se recuerda (spec 043).
#
# `specs/mapa.json` dijo `Propuesto` sobre CINCO specs mergeados —038 a 042—, con sus cinco issues
# cerrados y sus cinco PR en `main`. No fue un descuido de una vez: el gate del spec 038 tiene dos
# tests que se miran en espejo —un PR aterrizado con el mapa en `Propuesto` es mentira, y un
# `Implementado` sin PR aterrizado es la mentira al reves— y juntos **prohiben actualizar el mapa
# adentro del PR que lo justifica**. No hay ningun commit de ese PR que deje las dos cosas ciertas,
# asi que el paso queda para un commit posterior, a mano, en `main` — el que se olvida.
#
# La salida no es acordarse mejor: es que el estado deje de ser una afirmacion humana. Un PR aterrizo
# o no, y eso no lo escribe nadie. Este workflow lo calcula y lo commitea; el gate del 038 queda como
# confirmacion de un calculo, no como recordatorio de una tarea.
#
# Lo que este workflow NO hace, a proposito:
#
#   - **No cierra issues**, y por eso no pide `issues: write`. Medido sobre los specs 038 a 042: sus
#     cinco issues se cerraron UN SEGUNDO despues del merge de su PR, solos, por el `Closes #N` del
#     cuerpo. Esa mitad ya es automatica.
#   - **No corre `pnpm verify`.** Eso lo hace `verify.yml` sobre el mismo push. Este hace una cosa, y
#     por eso tarda ~20 s contra los 87 s de aquel: no instala dependencias ni baja Chromium.
#   - **No hidrata `specs/`.** El tercer bloque del gate del 038 —«ningun spec cerrado tiene
#     pendientes > 0»— necesita los `tasks.md`, que son cache desde el 034. Sigue salteandose, y
#     sigue declarandolo.
name: mapa

# Corre sobre `staging` y no sobre `main`, y no es una preferencia: es la unica forma que queda.
# `main` tiene un ruleset que exige PR y `verify` en verde, y el bypass por integracion —que seria el
# lugar natural para la app de Actions— **no existe en un repo personal**: la API lo rechaza con
# «Actor GitHub Actions integration must be part of the ruleset source or owner organization».
#
# Sin bypass, un `git push origin HEAD:main` desde acá queda rechazado. Y abrir un PR en vez de
# pushear tampoco sirve: un PR creado con `GITHUB_TOKEN` no dispara workflows, asi que `verify` nunca
# correria sobre el y el check requerido nunca se satisfaria — el PR quedaria abierto para siempre.
#
# `staging` no tiene ruleset, asi que el push directo sigue siendo posible y este workflow sigue
# siendo lo que era. El mapa derivado llega a `main` con el PR de promocion, como todo lo demas.
on:
  push:
    branches: [staging]

# `contents: write` porque commitea. Los otros dos son de lectura y son lo que le faltaba a la CI
# para poder preguntar: el default del repo es `read` a secas —`default_workflow_permissions`— asi
# que todo permiso hay que declararlo, y el log de cada corrida imprime los efectivos.
permissions:
  contents: write
  issues: read
  pull-requests: read

# Dos corridas escribiendo el mismo archivo se pisan. Se encolan en vez de cancelarse: la que ya
# arranco esta a punto de dejar el registro al dia, y cancelarla no ahorra nada que importe.
#
# Encolar sin mas no alcanza —la corrida que espera arrancaria con un `staging` viejo—, y eso lo
# cierra el `ref: staging` del checkout, abajo. Las dos cosas van juntas: sin la cola se pisan, sin el
# `ref` la segunda deriva sobre un arbol que ya no es `staging`.
concurrency:
  group: mapa
  cancel-in-progress: false

jobs:
  derivar:
    runs-on: ubuntu-latest
    steps:
      # `ref: staging` y no el `github.sha` del evento, que es el default. La diferencia importa
      # cuando llegan dos pushes seguidos, que en este repo pasa: se mergea en lote. La corrida B
      # queda encolada por el `concurrency` de arriba, y con el default arrancaria con el arbol del
      # commit que la disparo — mientras que `staging` ya avanzo, porque la corrida A le pusheo el
      # commit derivado. El push de B saldria non-fast-forward y el job quedaria ROJO, y sin
      # arreglarse solo: los pushes con `GITHUB_TOKEN` no disparan workflows, asi que no hay corrida
      # siguiente.
      #
      # Con `ref: staging` cada corrida deriva sobre el `staging` que hay cuando le toca, que es lo
      # unico que tiene sentido para algo que se calcula entero cada vez. Queda una ventana chica —una
      # persona pusheando entre el checkout y el push, ~20 s— y esa SI se arregla sola: un push
      # humano dispara este mismo workflow otra vez.
      - uses: actions/checkout@v5
        with:
          ref: staging

      # La misma version EXACTA que `verify.yml`, por el mismo motivo que alla: `22` a secas resuelve
      # a la ultima 22.x del dia.
      #
      # `package-manager-cache: false` porque este job NO instala nada: `lib/specs.ts` no importa
      # nada —cero lineas de `import`— y `lib/gh.ts` importa solo `node:child_process` y `node:fs`,
      # asi que node corre el `.ts` directo por type stripping y no hay `node_modules` que traer.
      #
      # Ese input NO es opcional por omision: su default es `true`, y con un `packageManager` de pnpm
      # declarado en el `package.json` la action intenta cachear el store —para lo cual necesita el
      # binario, que en este job no esta—. La primera corrida de este workflow, la del merge de su
      # propio PR, murio exactamente ahi y sin llegar a derivar nada:
      #
      #     ##[error]Unable to locate executable file: pnpm.
      #
      # Las salidas eran dos: ponerle un `pnpm/action-setup@v4` delante, como hace `verify.yml`, o
      # apagar el cache. Va la segunda. Aquel lo necesita porque corre `pnpm verify`; este no corre
      # pnpm en ningun paso, y traer el binario para llenar un cache que despues nadie lee es trabajo
      # que existiria solo para que la action no se queje.
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false

      # Si las listas de `gh` vuelven truncadas, el script sale 1 sin escribir y el job falla. Es lo
      # correcto: en una lista cortada «este spec no tiene PR» y «su PR no entro en la pagina» no se
      # distinguen, y derivar sobre eso pondria en `Propuesto` a todo spec que quedo afuera.
      - name: Derivar specs/mapa.json desde los PR y los issues
        run: node .claude/scripts/derivar-mapa.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      # `if` y no `&&`: los pasos corren con `bash -e`, y `git diff --quiet ... && exit 0` devuelve 1
      # cuando SI hay cambios, o sea que el paso fallaria justo en el caso que tiene trabajo.
      #
      # Se pushea `HEAD:staging` y no `staging` a secas: es explicito sobre que rama recibe, que es
      # lo que se quiere en un paso que escribe en una rama compartida. Si `staging` se movio entre el
      # checkout y esta linea el push falla, y falla fuerte — que es correcto: fue una persona quien
      # pusheo, y ese push dispara este workflow de nuevo.
      - name: Commitear si el mapa cambio
        run: |
          if git diff --quiet specs/mapa.json; then
            echo "el mapa ya estaba al dia: no hay nada que commitear"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/mapa.json
          git commit -m "El mapa se pone al dia con lo que los PR ya decidieron

          Derivado por .github/workflows/mapa.yml (spec 043). El estado de un spec es
          una consecuencia de si su PR aterrizo, no un dato que alguien escribe."
          git push origin HEAD:staging
