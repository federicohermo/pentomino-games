# El nodo de convergencia del repo, corrido por la maquina y no por la memoria de quien commitea.
#
# Por que corre `pnpm verify` entero y NO enumera sus nodos como pasos separados:
#
#   1. La forma exacta de ese script ya costo dos trampas de la familia «fallar en verde» —el filtro
#      `{.}`, sin el cual `--parallel` excluye el paquete raiz y reporta exito sin correr nada de la
#      app, y el `$` del regex, sin el cual el patron engancha `test:watch` y arranca un segundo
#      vitest—. Enumerar los nodos aca crearia un segundo lugar donde esa forma vive, y el dia que
#      alguien toque el script la CI seguiria corriendo el viejo.
#   2. Y no es principio: hay evidencia. El spec 029 le cambio la forma —el nodo `test` paso a ser
#      `suite`, que es `test && coverage` con umbral 100—. Un workflow que enumerara nodos habria
#      quedado corriendo `test` a secas, o sea verde sin el gate de coverage, que es exactamente el
#      modo de falla que este workflow existe para cerrar.
#
# Lo que este workflow NO hace, a proposito:
#
#   - No arma matriz de Node (D2 del spec 023). `mcp-server` declara `engines: >=22.18` y Netlify usa
#     22; una matriz 20 x 22 haria fallar el nodo del server en 20 por un piso de tooling que ya esta
#     declarado y decidido. El requisito de Vite (^20.19 || >=22.12) se verifica solo, por el
#     `engines` del `package.json` raiz.
#   - No despliega. Netlify ya lo hace, con su propio `command = "pnpm run build"`.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # La version de pnpm sale de `packageManager`, que es de donde ya la toma Netlify via Corepack.
      # Sin `version:` la action la lee de ahi sola, y ese numero sigue viviendo en un solo lugar.
      # Va ANTES de setup-node porque `cache: pnpm` necesita el binario ya instalado.
      - uses: pnpm/action-setup@v4

      # Version EXACTA y no `22` a secas, que resuelve a la ultima 22.x del dia y convierte
      # al runtime del gate en un blanco movil: el mismo commit puede dar verde hoy y rojo
      # el mes que viene sin que nadie toque una linea. Medido y no teorico: con `22` el
      # nodo `mcp:test` daba `99.64% branch coverage does not meet threshold of 100%` en
      # `symbols.ts` mientras la misma corrida en 22.18.0 da 100 en las cuatro — V8 cuenta
      # ramas distinto entre minors, asi que el numero que el 029 fijo en 100 depende del
      # runtime que lo mide.
      #
      # El piso del proyecto sigue siendo el `engines` (^20.19.0 || >=22.12.0): esto no lo
      # estrecha, elige UNA version adentro de el para que el gate sea reproducible. Subirla
      # es un cambio deliberado, con `pnpm verify` corrido en la version nueva antes.
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: pnpm

      # Congelado: una deriva entre `package.json` y `pnpm-lock.yaml` rompe la CI en vez de
      # resolverse sola.
      - run: pnpm install --frozen-lockfile

      # Chromium no esta en el lockfile y desde el spec 029 hay tests que corren en uno de verdad
      # —es la unica forma de cubrir el canvas del espectro y el `AudioContext` del motor—. Un runner
      # es un clone nuevo en cada corrida, asi que sin este paso el job no llega a ejecutar un test,
      # y con el job muerto no habria como distinguir un rojo real de un binario que falta.
      # `--with-deps` porque el runner de Ubuntu no trae las librerias de sistema que Chromium pide:
      # sin el flag el binario baja y falla igual al lanzarlo.
      - run: pnpm exec playwright install --with-deps chromium

      # TEMPORAL — se borra en el commit siguiente. Imprime QUE rama de `symbols.ts` queda
      # sin cubrir en Linux, que en Windows si se cubre. Va antes de `verify` porque `verify`
      # falla y cortaria el job.
      - name: TEMPORAL detalle de ramas de symbols.ts
        run: |
          cd mcp-server
          node --test --experimental-test-coverage             --test-coverage-include="src/**"             --test-coverage-exclude="src/__tests__/**"             --test-coverage-exclude="src/index.ts"             --test-reporter=lcov --test-reporter-destination=cov.info             "src/__tests__/*.test.ts" > /dev/null 2>&1 || true
          echo "=== BRDA sin cubrir en symbols.ts (linea,bloque,rama,hits) ==="
          awk '/^SF:.*symbols\.ts/,/^end_of_record/' cov.info | grep '^BRDA:' | awk -F, '$4=="0" || $4=="-"'
          echo "=== total de ramas del archivo ==="
          awk '/^SF:.*symbols\.ts/,/^end_of_record/' cov.info | grep -c '^BRDA:'
          rm -f cov.info

      - run: pnpm verify
