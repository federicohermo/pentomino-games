# El nodo de convergencia del repo, corrido por la maquina y no por la memoria de quien commitea.
#
# Por que corre `pnpm verify` entero y NO enumera sus nodos como pasos separados:
#
#   1. La forma exacta de ese script ya costo dos trampas de la familia «fallar en verde» —el filtro
#      `{.}`, sin el cual `--parallel` excluye el paquete raiz y reporta exito sin correr nada de la
#      app, y el `$` del regex, sin el cual el patron engancha `test:watch` y arranca un segundo
#      vitest—. Enumerar los nodos aca crearia un segundo lugar donde esa forma vive, y el dia que
#      alguien toque el script la CI seguiria corriendo el viejo.
#   2. Y no es principio: hay evidencia. El spec 029 le cambio la forma —el nodo `test` paso a ser
#      `suite`, que es `test && coverage` con umbral 100—. Un workflow que enumerara nodos habria
#      quedado corriendo `test` a secas, o sea verde sin el gate de coverage, que es exactamente el
#      modo de falla que este workflow existe para cerrar.
#
# Lo que este workflow NO hace, a proposito:
#
#   - No arma matriz de Node (D2 del spec 023). `mcp-server` declara `engines: >=22.18`, asi que una
#     matriz 20 x 22 haria fallar el nodo del server en 20 por un piso de tooling que ya esta
#     declarado y decidido. El requisito de Vite (^20.19 || >=22.12) se verifica solo, por el
#     `engines` del `package.json` raiz.
#   - No despliega. Vercel ya lo hace, con su propio `buildCommand` en `vercel.json`.
name: verify

on:
  pull_request:
  # Las DOS ramas, desde que `main` es la rama de release y `staging` la de integracion. `staging`
  # esta primero porque es donde aterriza el trabajo: es el push que de verdad hay que verificar. El
  # de `main` se queda porque un PR de promocion mergeado es un push mas, y la rama que se deploya no
  # puede ser la unica sin corrida propia.
  push:
    branches: [staging, main]

# Los dos de lectura son del spec 043, y son lo que le faltaba al gate del mapa para poder correr
# aca. `gh` NO falta —el runner declara `Image: ubuntu-24.04` y esa imagen trae GitHub CLI 2.97.0—:
# lo que faltaba era la sesion, y esta en el log de cada corrida. El bloque `GITHUB_TOKEN Permissions`
# de la del 25/08 decia `Contents: read` y `Metadata: read`, y nada mas. Con eso `gh` arranca,
# pregunta, y la API le contesta que no: el `catch` del gate lo lee como «no pude verificar» y se
# saltea DECLARANDOLO, que es correcto y ademas es como se descubrio todo esto.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # La version de pnpm sale de `packageManager`. Vercel NO la lee de ahi —deduce pnpm del
      # `lockfileVersion` salvo con ENABLE_EXPERIMENTAL_COREPACK=1, ver docs/infra/deploy.md—, asi
      # que este pin vale para la CI y para local, no para el deploy.
      # Sin `version:` la action la lee de ahi sola, y ese numero sigue viviendo en un solo lugar.
      # Va ANTES de setup-node porque `cache: pnpm` necesita el binario ya instalado.
      - uses: pnpm/action-setup@v4

      # Version EXACTA y no `22` a secas, que resuelve a la ultima 22.x del dia y convierte
      # al runtime del gate en un blanco movil: el mismo commit puede dar verde hoy y rojo
      # el mes que viene sin que nadie toque una linea.
      #
      # Ese es el UNICO argumento del pin, y hay que decirlo porque se probo otro y salio
      # mal: se fijo la version sospechando que V8 contaba ramas distinto entre minors y que
      # eso explicaba el `99.64% branch coverage` de `symbols.ts` en `mcp:test`. Quedo
      # falsificado — con 22.18.0 fijo el numero es identico—, asi que el pin NO arreglo ese
      # rojo. Lo arreglo despues el comparador del `sort` de `walk()`, que tenia una rama
      # cuya cobertura dependia del orden del filesystem; el porque vive en su docblock.
      # El pin se queda por reproducibilidad, y nunca fue por ese sintoma.
      #
      # El piso del proyecto sigue siendo el `engines` (^20.19.0 || >=22.12.0): esto no lo
      # estrecha, elige UNA version adentro de el. Subirla es un cambio deliberado, con
      # `pnpm verify` corrido en la version nueva antes.
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: pnpm

      # Congelado: una deriva entre `package.json` y `pnpm-lock.yaml` rompe la CI en vez de
      # resolverse sola.
      - run: pnpm install --frozen-lockfile

      # Chromium no esta en el lockfile y desde el spec 029 hay tests que corren en uno de verdad
      # —es la unica forma de cubrir el canvas del espectro y el `AudioContext` del motor—. Un runner
      # es un clone nuevo en cada corrida, asi que sin este paso el job no llega a ejecutar un test,
      # y con el job muerto no habria como distinguir un rojo real de un binario que falta.
      # `--with-deps` porque el runner de Ubuntu no trae las librerias de sistema que Chromium pide:
      # sin el flag el binario baja y falla igual al lanzarlo.
      - run: pnpm exec playwright install --with-deps chromium

      # El token va SOLO en el PR, y esto no es una excepcion escondida: es donde vive la autoridad
      # sobre el mapa (spec 043).
      #
      # Cuando el PR de un spec aterriza, ese push a `staging` dispara los DOS workflows a la vez. En
      # ese commit el mapa todavia dice `Propuesto` —no puede decir otra cosa: el gate del 038
      # prohibe cambiarlo adentro del PR— y el PR ya figura `MERGED`, o sea exactamente la condicion
      # que el gate declara mentira. `mapa.yml` la corrige en ~20 s, pero `verify` no la espera:
      # arranca con el mismo commit, tarda 87 s, y lee el mapa de ANTES. Y como el push de la Action
      # va con el `GITHUB_TOKEN`, no dispara una segunda corrida que salga verde.
      #
      # La carrera es la misma de siempre y solo cambio de rama: hasta que `main` paso a ser la rama
      # de release, los dos workflows se disparaban sobre `main` y el conflicto pasaba ahi.
      #
      # Sin esto, cada merge de spec dejaria la rama de integracion en rojo con un rojo que ya esta
      # arreglado y que nadie va a volver a correr — la forma mas rapida conocida de que alguien
      # apague el gate.
      #
      # En un PR el mapa SI tiene que estar consistente y el gate es lo unico que lo mira: ahi sigue
      # cazando todo lo demas —la mentira al reves, el cruce contra el issue, los titulos, y la
      # deriva de cualquier otro spec—. Fuera de un PR el mapa no es la afirmacion de nadie: es una
      # derivada, y el que la calcula es el otro workflow.
      #
      # Las dos alternativas se descartaron y estan escritas en el `plan.md` del 043: encadenar los
      # workflows con `workflow_run` le cambia el trigger al gate principal del repo —el del 023—
      # para arreglar un borde de otro workflow; y tolerar en el gate un PR mergeado hace menos de N
      # minutos mete una ventana temporal que envejece y que en un runner lento se abre sola.
      #
      # El `''` de la rama falsa es un token vacio, que `gh` trata como ausente: en un push a `main`
      # los dos bloques de red se saltean igual que hoy, declarandolo en el reporte.
      - run: pnpm verify
        env:
          GH_TOKEN: ${{ github.event_name == 'pull_request' && github.token || '' }}
